{% if page.translations.zh and page.translations.en %}
<nav class="mb-4" aria-label="Switch article language">
  {% if page.translations.current == 'en' %}
  <a class="btn btn-sm btn-outline-secondary" lang="zh-CN" href="{{ page.translations.zh | relative_url }}">中文</a>
  {% else %}
  <a class="btn btn-sm btn-outline-secondary" lang="en" href="{{ page.translations.en | relative_url }}">English</a>
  {% endif %}
</nav>
{% endif %}
